name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fenced
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fenced
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fail if schema.ts changed without a generated migration
        working-directory: apps/api
        run: |
          pnpm exec drizzle-kit generate
          if [ -n "$(git status --porcelain -- src/db/migrations)" ]; then
            git status --porcelain -- src/db/migrations
            echo "::error::schema.ts and the committed migrations disagree. Run 'pnpm --filter @fenced/api db:generate' and commit the result."
            exit 1
          fi

      - name: Apply migrations to an empty database
        working-directory: apps/api
        run: pnpm exec drizzle-kit migrate

      - name: Migrations are idempotent
        working-directory: apps/api
        run: pnpm exec drizzle-kit migrate
